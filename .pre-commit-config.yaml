repos:
  - repo: local
    hooks:
      - id: project-structure
        name: validate project structure
        entry: python utils/validate_project_structure.py
        language: system
        pass_filenames: false
        always_run: true

      - id: staged-diff-check
        name: git diff --cached --check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-change-review
        name: inspect staged architecture changes
        entry: python utils/validate_agent_changes.py --staged
        language: system
        pass_filenames: false
        always_run: true

      - id: gdscript-format-check
        name: check changed GDScript formatting and role-aware lint
        entry: python utils/check_gdscript_format.py
        language: system
        files: \.gd$
        exclude: ^addons/
