name: Package history and missed registration validation

on:
  push:
    branches:
      - master
    paths:
      - content/components/gameplay/c_package.gd
      - content/components/gameplay/c_package_ledger.gd
      - content/contracts/customers/customer_visit.gd
      - content/contracts/packages/package_history_id.gd
      - content/definitions/gameplay/packages/def_package.gd
      - content/definitions/gameplay/deliveries/def_delivery_morning_supply.tres
      - content/services/customers/customer_flow_service.gd
      - content/services/packages/package_history_service.gd
      - content/services/packages/receiving_delivery_service.gd
      - content/debug/debug_package_service.gd
      - tests/gut/test_customer_flow.gd
      - tests/gut/test_package_history_id.gd
      - tests/smoke/unregistered_loss_smoke.gd
      - tests/smoke/unregistered_loss_smoke.tscn
      - .github/workflows/package_history_loss_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Focused GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path .             -s addons/gut/gut_cmdln.gd             -gdir=res://tests/gut             -gselect test_package_history_id.gd             -gselect test_customer_flow.gd             -gexit 2>&1 | tee package-history-gut.log
          grep -q "Passing Tests" package-history-gut.log
          if grep -Eq "GUT ERROR|SCRIPT ERROR|Parse Error|Assertion failed" package-history-gut.log; then exit 1; fi

      - name: Next-morning missed-registration smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path .             res://tests/smoke/unregistered_loss_smoke.tscn             --quit-after 900 2>&1 | tee unregistered-loss-smoke.log
          grep -q "Missed unregistered package next-morning loss smoke PASS" unregistered-loss-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Assertion failed" unregistered-loss-smoke.log; then exit 1; fi
