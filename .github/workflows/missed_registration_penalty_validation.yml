name: Missed registration penalty validation

on:
  push:
    branches:
      - master
    paths:
      - content/contracts/economy/money_operation.gd
      - content/contracts/customers/customer_visit.gd
      - content/definitions/gameplay/economy/def_economy.gd
      - content/services/economy/wallet_service.gd
      - content/services/customers/customer_outcome_service.gd
      - tests/gut/test_wallet.gd
      - tests/gut/test_customer_flow.gd
      - tests/smoke/unregistered_loss_smoke.gd
      - .github/workflows/missed_registration_penalty_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Bootstrap Godot class cache
        shell: bash
        run: |
          set +e
          timeout 90s godot --headless --path . --import --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          test -f .godot/global_script_class_cache.cfg

      - name: Wallet GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gselect test_wallet.gd -gexit 2>&1 | tee wallet-gut.log
          grep -q 'Ran Scripts matching "test_wallet.gd"' wallet-gut.log
          grep -q -- '---- All tests passed! ----' wallet-gut.log

      - name: Customer flow GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gselect test_customer_flow.gd -gexit 2>&1 | tee customer-flow-gut.log
          grep -q 'Ran Scripts matching "test_customer_flow.gd"' customer-flow-gut.log
          grep -q -- '---- All tests passed! ----' customer-flow-gut.log

      - name: Missed registration smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . res://tests/smoke/unregistered_loss_smoke.tscn --quit-after 1200 2>&1 | tee missed-registration.log
          grep -q "Unregistered customer gate and next-morning loss smoke PASS" missed-registration.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Assertion failed" missed-registration.log; then exit 1; fi
