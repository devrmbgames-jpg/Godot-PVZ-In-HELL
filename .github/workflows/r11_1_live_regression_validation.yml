name: R11.1 live regression validation

on:
  push:
    branches:
      - fix/r11-1-m5-live-test-regressions
    paths:
      - content/contracts/interaction/stored_body_snapshot.gd
      - content/entities/props/e_physical_slot.gd
      - content/entities/props/physical_slot.tscn
      - content/entities/props/anchorable_test_box.tscn
      - content/entities/tools/hammer.tscn
      - content/scenes/main_level.tscn
      - content/services/interaction/interaction_targeting_service.gd
      - content/services/interaction/physical_slot_service.gd
      - tests/gut/test_physical_slots.gd
      - tests/gut/test_anchoring.gd
      - tests/smoke/physical_slots_placement_smoke.gd
      - tests/smoke/physical_slots_placement_smoke.tscn
      - tests/smoke/anchoring_smoke.gd
      - tests/smoke/anchoring_smoke.tscn
      - .github/workflows/r11_1_live_regression_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Physical slot GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path .             -s addons/gut/gut_cmdln.gd             -gdir=res://tests/gut             -gselect test_physical_slots.gd             -gexit 2>&1 | tee physical-slots-gut.log
          grep -q "Passing Tests" physical-slots-gut.log
          grep -q 'Ran Scripts matching "test_physical_slots.gd"' physical-slots-gut.log
          if grep -q "GUT ERROR" physical-slots-gut.log; then exit 1; fi
          if grep -q "Failing Tests" physical-slots-gut.log; then exit 1; fi

      - name: Anchoring GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path .             -s addons/gut/gut_cmdln.gd             -gdir=res://tests/gut             -gselect test_anchoring.gd             -gexit 2>&1 | tee anchoring-gut.log
          grep -q "Passing Tests" anchoring-gut.log
          grep -q 'Ran Scripts matching "test_anchoring.gd"' anchoring-gut.log
          if grep -q "GUT ERROR" anchoring-gut.log; then exit 1; fi
          if grep -q "Failing Tests" anchoring-gut.log; then exit 1; fi

      - name: Physical slot and placement smoke
        shell: pwsh
        run: ./utils/run_smoke.ps1 -Name physical_slots_placement

      - name: Anchoring smoke
        shell: pwsh
        run: ./utils/run_smoke.ps1 -Name anchoring
