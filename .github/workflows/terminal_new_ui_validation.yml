name: Terminal NewUI validation

on:
  push:
    branches:
      - master
    paths:
      - content/ui/terminal_panel.gd
      - content/ui/ui_terminal_package_line.gd
      - content/ui/ui_terminal_package_detail_info.gd
      - content/ui/ui_terminal_log_history.gd
      - content/contracts/packages/package_registration_record.gd
      - content/services/packages/package_registration_service.gd
      - content/services/customers/customer_flow_service.gd
      - tests/gut/test_terminal_new_ui.gd
      - .github/workflows/terminal_new_ui_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Bootstrap Godot class cache
        shell: bash
        run: bash utils/bootstrap_godot_class_cache.sh

      - name: Terminal NewUI GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gselect test_terminal_new_ui.gd -gexit 2>&1 | tee terminal-new-ui-gut.log
          grep -q 'Ran Scripts matching "test_terminal_new_ui.gd"' terminal-new-ui-gut.log
          grep -q -- '---- All tests passed! ----' terminal-new-ui-gut.log
          if grep -Eq "GUT ERROR|SCRIPT ERROR|Parse Error|Assertion failed" terminal-new-ui-gut.log; then exit 1; fi
