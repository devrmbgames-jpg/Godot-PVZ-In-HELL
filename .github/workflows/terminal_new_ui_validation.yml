name: Terminal NewUI validation

on:
  push:
    branches:
      - master
    paths:
      - content/ui/terminal_panel.gd
      - content/ui/ui_terminal_package_line.gd
      - content/ui/ui_terminal_package_detail_info.gd
      - content/ui/ui_terminal_log_history.gd
      - content/contracts/packages/package_registration_record.gd
      - content/services/packages/package_registration_service.gd
      - content/services/customers/customer_flow_service.gd
      - tests/gut/test_terminal_new_ui.gd
      - .github/workflows/terminal_new_ui_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Bootstrap Godot class cache
        shell: bash
        run: bash utils/bootstrap_godot_class_cache.sh

      - name: Parse TerminalPanel without asset import
        run: godot --headless --path . --check-only --script content/ui/terminal_panel.gd

      - name: Parse package line without asset import
        run: godot --headless --path . --check-only --script content/ui/ui_terminal_package_line.gd

      - name: Parse package detail without asset import
        run: godot --headless --path . --check-only --script content/ui/ui_terminal_package_detail_info.gd

      - name: Parse terminal log without asset import
        run: godot --headless --path . --check-only --script content/ui/ui_terminal_log_history.gd

      - name: Assert legacy Terminal API is gone
        shell: bash
        run: |
          ! grep -R "dispose_refusal(" content tests --include='*.gd'
          ! grep -R "terminal_text(" content tests --include='*.gd'
          ! grep -R "registry_text(" content tests --include='*.gd'
          ! grep -R "Root/Panel/Margin/Rows" content tests --include='*.gd' --include='*.tscn'
