name: Valve fixture validation

on:
  push:
    branches:
      - feature/r11-1-valve-test-bench
    paths:
      - content/entities/props/e_interaction_test_valve.gd
      - content/entities/props/interaction_test_valve.tscn
      - content/definitions/interaction/def_interaction_test_valve_action.gd
      - content/ui/interaction_test_indicator_lamp.gd
      - content/scenes/main_level.tscn
      - .github/workflows/valve_fixture_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Validate valve fixture
        shell: pwsh
        run: ./utils/run_smoke.ps1 -Name valve_fixture
