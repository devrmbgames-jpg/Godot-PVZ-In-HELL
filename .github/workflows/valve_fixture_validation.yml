name: Valve fixture validation

on:
  push:
    branches:
      - feature/r11-1-valve-test-bench
    paths:
      - content/entities/props/e_interaction_test_valve.gd
      - content/entities/props/interaction_test_valve.tscn
      - content/definitions/interaction/def_interaction_test_valve_action.gd
      - content/ui/interaction_test_indicator_lamp.gd
      - content/scenes/main_level.tscn
      - .github/workflows/valve_fixture_validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Validate valve fixture
        shell: bash
        run: |
          cat > /tmp/valve_fixture_smoke.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              _run.call_deferred()

          func _run() -> void:
              var main_scene: PackedScene = load("res://content/scenes/main_level.tscn") as PackedScene
              assert(main_scene != null)

              var packed: PackedScene = load("res://content/entities/props/interaction_test_valve.tscn") as PackedScene
              assert(packed != null)

              var expected_slots: Array[int] = [0, 1, 1, 1, 1]
              var expected_policies: Array[int] = [-1, 0, 1, 2, 3]
              for mode_index: int in 5:
                  var valve: E_InteractionTestValve = packed.instantiate() as E_InteractionTestValve
                  assert(valve != null)
                  valve.mode = mode_index as E_InteractionTestValve.Mode
                  root.add_child(valve)
                  await process_frame

                  var actions: C_InteractionActionSet = valve.get_component(C_InteractionActionSet) as C_InteractionActionSet
                  assert(actions != null)
                  var available: Array[DEF_InteractionAction] = []
                  for action: DEF_InteractionAction in actions.actions:
                      if action != null and action.is_available(null, valve, valve):
                          available.append(action)
                  assert(available.size() == 1)
                  var selected: DEF_InteractionAction = available[0]
                  assert(selected.slot == expected_slots[mode_index])
                  if expected_policies[mode_index] < 0:
                      assert(selected.timing == null)
                  else:
                      assert(selected.timing != null)
                      assert(selected.timing.reset_policy == expected_policies[mode_index])

                  var lamp: Node3D = valve.get_node("IndicatorLamp") as Node3D
                  var on_bulb: MeshInstance3D = lamp.get_node("OnBulb") as MeshInstance3D
                  assert(not on_bulb.visible)
                  valve.activate()
                  await process_frame
                  assert(on_bulb.visible)
                  valve.queue_free()
                  await process_frame

              print("Valve fixture validation PASS")
              quit()
          GDSCRIPT
          set -o pipefail
          godot --headless --path . --script /tmp/valve_fixture_smoke.gd 2>&1 | tee valve-fixture.log
          grep -q "Valve fixture validation PASS" valve-fixture.log
