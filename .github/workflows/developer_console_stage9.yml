name: Developer console Stage 9 validation

on:
  push:
    branches:
      - task/developer-console-testing-stage9
    paths:
      - tests/gut/test_developer_console.gd
      - tests/smoke/developer_console_smoke.gd
      - tests/smoke/developer_console_smoke.tscn
      - .github/workflows/developer_console_stage9.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Focused developer console GUT
        run: >-
          godot --headless --path .
          -s addons/gut/gut_cmdln.gd
          -gdir=res://tests/gut
          -gselect test_developer_console.gd
          -gexit

      - name: Developer console headless smoke
        shell: pwsh
        run: ./utils/run_smoke.ps1 -Name developer_console
