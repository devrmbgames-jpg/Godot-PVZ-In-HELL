project_doc_max_bytes = 8192
tool_output_token_limit = 4000

[agents]
enabled = true
max_concurrent_threads_per_session = 1

[agents.reviewer]
description = "Opt-in focused review of a substantial completed diff for correctness and regressions."
config_file = "./agents/reviewer.toml"

[agents.validator]
description = "Opt-in execution of explicitly requested validation with concise PASS/FAIL output."
config_file = "./agents/validator.toml"
