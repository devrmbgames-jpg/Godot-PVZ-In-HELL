model = "gpt-6.1-sol"

# Main implementation default.
model_reasoning_effort = "high"

# Architecture/planning tasks may use more reasoning.
plan_mode_reasoning_effort = "xhigh"

model_verbosity = "medium"
model_reasoning_summary = "auto"

file_opener = "vscode"
web_search = "live"

# Keep project instructions bounded.
project_doc_max_bytes = 16384

# Prevent noisy Godot/tool output from consuming context.
tool_output_token_limit = 8096


# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------

[agents]
enabled = true
# Capacity is 2; the pilot policy still allows only ONE reviewer concurrently.
# Validator and any second child are serialized to avoid shared Godot/editor conflicts.
# This does not change the configured capacity or model reasoning.
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents.reviewer]
description = "Read-only review of an immutable committed diff; run alongside independent main-agent work."
config_file = "./agents/reviewer.toml"

[agents.validator]
description = "Opt-in execution of explicitly assigned validation with concise PASS/FAIL output."
config_file = "./agents/validator.toml"
