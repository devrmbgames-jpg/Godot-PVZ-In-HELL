model = "gpt-6.1-sol"

# Main implementation: strong reasoning without using xhigh for every edit.
model_reasoning_effort = "high"

# Planning can spend more reasoning than routine implementation.
plan_mode_reasoning_effort = "xhigh"

model_verbosity = "medium"
model_reasoning_summary = "auto"
file_opener = "vscode"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Guard against instruction creep. AGENTS.md + scoped instructions should stay lean.
project_doc_max_bytes = 16384

# Keep noisy Godot/tool output from consuming the session context.
tool_output_token_limit = 8096

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents.reviewer]
description = "Opt-in focused review of a substantial completed diff for Godot 4.7+, GECS correctness, and regressions."
config_file = "./agents/reviewer.toml"

[agents.validator]
description = "Opt-in execution of explicitly assigned validation with concise PASS/FAIL output."
config_file = "./agents/validator.toml"

[sandbox_workspace_write]
network_access = true

# Godot user:// data lives outside the repository.
writable_roots = [
    "C:\\Users\\Valeryn\\AppData\\Roaming\\Godot\\app_userdata"
]



[mcp_servers."godot-ai"]
command = "C:\\Users\\Valeryn\\AppData\\Local\\Microsoft\\WindowsApps\\PythonSoftwareFoundation.Python.3.11_qbz5n2kfra8p0/pythonw.exe"
args = [
  "-c",
  "import subprocess,sys; raise SystemExit(subprocess.call(sys.argv[1:], stdin=sys.stdin, stdout=sys.stdout, stderr=sys.stderr, creationflags=0x08000000))",
  "C:\\Users\\Valeryn/.local/bin/uvx.exe",
  "--isolated",
  "--no-config",
  "--no-env-file",
  "--no-sources",
  "--no-build",
  "--index-strategy",
  "first-index",
  "--keyring-provider",
  "disabled",
  "--index",
  "https://pypi.org/simple",
  "--default-index",
  "https://pypi.org/simple",
  "--find-links",
  "https://pypi.org/simple/godot-ai/",
  "--link-mode",
  "copy",
  "--from",
  "godot-ai==4.2.3",
  "godot-ai",
  "attach",
  "--port",
  "8001",
  "--ws-port",
  "9500",
]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 360


