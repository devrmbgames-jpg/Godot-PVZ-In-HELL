model = "gpt-6.1-sol"

# Основная работа: достаточно глубоко, но без постоянного max.
model_reasoning_effort = "high"

# Планирование сложных задач — глубже.
plan_mode_reasoning_effort = "xhigh"

# Не раздувать ответы и отчеты без необходимости.
model_verbosity = "medium"
model_reasoning_summary = "auto"

# Удобные ссылки на файлы из ответов Codex.
file_opener = "vscode"

# Разрешать команды с запросом подтверждения при необходимости.
approval_policy = "on-request"

# Разрешаем редактирование workspace и явно добавленных каталогов.
sandbox_mode = "workspace-write"

# Codex может использовать актуальный web search.
web_search = "live"

# AGENTS.md и вложенные проектные инструкции.
# Default у Codex сейчас 32 KiB; 16 KiB для твоих проектов выглядит
# разумным компромиссом между экономией контекста и сохранением правил.
project_doc_max_bytes = 16384

# Ограничиваем огромные логи/вывод shell, чтобы они не засоряли контекст.
tool_output_token_limit = 4000


[agents]
enabled = true

# Никакой параллельной гонки суб-агентов.
max_concurrent_threads_per_session = 1

# Если spawn не указал модель явно.
default_subagent_model = "gpt-6.1-sol"

# Суб-агенты дешевле основной работы.
# Конкретный reviewer может переопределить это своим toml.
default_subagent_reasoning_effort = "medium"


[agents.reviewer]
description = "Opt-in focused review of a substantial completed diff for Godot 3.6 correctness and regressions."
config_file = "./agents/reviewer.toml"


[agents.validator]
description = "Opt-in execution of explicitly assigned validation with concise PASS/FAIL output."
config_file = "./agents/validator.toml"


[sandbox_workspace_write]

# Разрешаем shell/network внутри workspace-write sandbox.
network_access = true

# Дополнительный каталог вне репозитория:
# Godot user:// для всех локальных проектов.
writable_roots = [
    "C:\\Users\\Valeryn\\AppData\\Roaming\\Godot\\app_userdata"
]
