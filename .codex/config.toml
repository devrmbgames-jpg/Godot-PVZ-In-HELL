# Keep the main model/reasoning session-owned; do not pin Astra/Sol here.
# Bounds protect context/quota without truncating normal Godot diagnostics.
project_doc_max_bytes = 6144
tool_output_token_limit = 4000

[agents]
enabled = true
# Opt-in subagents must run sequentially; avoid duplicate exploration/token races.
max_concurrent_threads_per_session = 1

[agents.reviewer]
description = "Opt-in focused review of a substantial completed diff for correctness and regressions."
config_file = "./agents/reviewer.toml"

[agents.validator]
description = "Opt-in execution of explicitly requested validation with concise PASS/FAIL output."
config_file = "./agents/validator.toml"
